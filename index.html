<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pakkeshoppen TV</title><style>html,body{margin:0;overflow:hidden;background:#c5e0ee;font-family:system-ui}canvas{display:block}header{position:fixed;top:3%;left:3%;color:white;text-shadow:0 2px 9px #3459;font-size:clamp(18px,3vw,40px);font-weight:900}small{display:block;font-size:.45em}footer{position:fixed;bottom:3%;left:3%;color:white;background:#183c53b8;padding:12px 18px;border-radius:25px;font-weight:700}button{position:fixed;top:3%;right:3%;border:0;border-radius:9px;padding:10px;cursor:pointer}</style><header>📦 Østergades Pakkeshop<small>En lille verden med store pakker</small></header><footer id="status">Velkommen til pakkeshoppen!</footer><button onclick="document.documentElement.requestFullscreen?.()">⛶ Fuldskærm</button><script type="module">
import * as T from 'https://esm.sh/three@0.170.0';
const scene=new T.Scene();scene.background=new T.Color('#c5e0ee');const camera=new T.OrthographicCamera(-10,10,5.625,-5.625,.1,100);camera.position.set(14,12,17);camera.lookAt(0,1,0);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;document.body.prepend(r.domElement);scene.add(new T.HemisphereLight(0xffffff,0x668077,2.5));let sun=new T.DirectionalLight(0xffeed4,3);sun.position.set(-8,15,10);sun.castShadow=true;scene.add(sun);
const m=c=>new T.MeshStandardMaterial({color:c,roughness:.85}),white=m('#f4f1e8'),roof=m('#303941'),blue=m('#1855a7'),glass=m('#8fb4c6'),asphalt=m('#858989'),walk=m('#d6cabc'),orange=m('#b86d57'),skin=m('#e6b391'),pants=m('#42566b'),card=m('#b98a5b');
function cube(w,h,d,x,y,z,mat,parent=scene){let a=new T.Mesh(new T.BoxGeometry(w,h,d),mat);a.position.set(x,y,z);a.castShadow=true;a.receiveShadow=true;parent.add(a);return a}
cube(24,.3,18,0,-.2,0,m('#9db28d'));cube(16,.04,8,-2,0,4.7,asphalt);cube(4,.06,14,7.5,.01,1,walk);for(let z=-5;z<8;z+=.8)cube(4,.008,.02,7.5,.05,z,m('#b8b0a2'));
cube(5.5,5.3,5.5,3.7,2.65,-4.4,orange);cube(5.8,.8,5.8,3.7,5.5,-4.4,roof);
cube(12,3.2,5,-1.4,1.6,-.5,white);cube(12.3,.32,5.2,-1.4,3.33,-.5,roof);for(let x of [-4.9,-2.4]){cube(1.75,1.6,.1,x,1.72,2.06,roof);cube(1.56,1.4,.12,x,1.72,2.13,glass);cube(.8,.26,.13,x+.35,2.31,2.22,blue)}cube(1,2,.12,-6,1.02,2.07,roof);cube(.8,1.78,.14,-6,1.05,2.15,glass);cube(1.45,2.2,.13,2.5,1.12,2.09,roof);cube(.48,.46,.15,2.5,1.74,2.19,glass);cube(2.5,.24,1.35,2.5,2.95,2.75,roof);cube(2,.14,1,2.5,.17,2.85,walk);cube(2.3,.13,1.25,2.5,.08,3.08,walk);
function sign(t,x,y,z,w=1.2){let c=document.createElement('canvas');c.width=512;c.height=160;let ctx=c.getContext('2d');ctx.fillStyle='#1653a7';ctx.fillRect(0,0,512,160);ctx.fillStyle='white';ctx.font='bold 80px Arial';ctx.textAlign='center';ctx.fillText(t,256,110);let tex=new T.CanvasTexture(c);let a=new T.Mesh(new T.PlaneGeometry(w,w*.31),new T.MeshBasicMaterial({map:tex,side:T.DoubleSide}));a.position.set(x,y,z);scene.add(a)}
sign('GLS.',4.2,2.5,2.11);sign('GLS.',-4.6,2.34,2.22,.75);sign('GLS.',-2.1,2.34,2.22,.75);sign('PAKKESHOP',-.5,2.8,2.15,2.2);
function tree(x,z){cube(.2,1,.2,x,.5,z,m('#82694b'));let a=new T.Mesh(new T.IcosahedronGeometry(.7,1),m('#67a86a'));a.position.set(x,1.45,z);a.castShadow=true;scene.add(a)}tree(-8,-4);tree(8,-4);tree(8,6);
function person(i,hasBox){let g=new T.Group();cube(.36,.55,.25,0,1,0,m(['#e6a065','#79a2d3','#9fc184','#bd9ed6'][i%4]),g);let h=new T.Mesh(new T.SphereGeometry(.2,12,10),skin);h.position.y=1.43;g.add(h);let legs=[];for(let s of [-1,1]){legs.push(cube(.13,.47,.14,s*.12,.48,0,pants,g));cube(.13,.35,.13,s*.26,1.05,0,m('#e7bfa2'),g)}if(hasBox)cube(.46,.35,.36,0,1,.32,card,g);scene.add(g);return {g,legs,hasBox}}
let people=[],total=0,wait=1,t=0;function spawn(){if(people.length>10)return;let hasBox=Math.random()<.5,o=person(total++,hasBox),left=Math.random()<.5,x=left?-9:9,z=left?5:6;people.push({o,start:new T.Vector3(x,.05,z),end:new T.Vector3(2.5,.05,3.6),p:0,phase:0,delay:0,speed:.18+Math.random()*.1});document.getElementById('status').textContent=hasBox?'📦 En kunde kommer for at sende en pakke':'🎁 En kunde kommer for at hente en pakke'}
let van=new T.Group();cube(2.1,1,1.1,0,.86,0,white,van);cube(.75,.83,1.1,.82,.75,0,white,van);cube(.22,.43,.9,1.2,.99,0,glass,van);cube(.8,.35,.02,-.3,1,.57,blue,van);for(let x of [-.7,.8])for(let z of [-.54,.54]){let w=new T.Mesh(new T.CylinderGeometry(.23,.23,.13,12),m('#292e34'));w.rotation.x=Math.PI/2;w.position.set(x,.3,z);van.add(w)}scene.add(van);van.position.set(-13,.03,5.5);let vanPhase=0,vanClock=0,prev=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.06,(now-prev)/1000);prev=now;t+=dt;wait-=dt;if(wait<0){spawn();wait=3+Math.random()*4}for(let i=people.length-1;i>=0;i--){let a=people[i];if(a.phase===1){a.delay-=dt;if(a.delay<0){a.phase=2;a.p=0;a.start=new T.Vector3(2.5,.05,3.6);a.end=new T.Vector3(Math.random()<.5?-9:9,.05,5+Math.random());a.o.g.visible=true;if(!a.o.hasBox)cube(.46,.35,.36,0,1,.32,card,a.o.g)}}else{a.p+=dt*a.speed;a.o.g.position.lerpVectors(a.start,a.end,Math.min(1,a.p));a.o.g.rotation.y=Math.atan2(a.end.x-a.start.x,a.end.z-a.start.z);a.o.legs[0].rotation.x=Math.sin(t*11+i)*.35;a.o.legs[1].rotation.x=-a.o.legs[0].rotation.x;if(a.p>=1){if(a.phase===0){a.phase=1;a.delay=2+Math.random()*3;a.o.g.visible=false}else{scene.remove(a.o.g);people.splice(i,1)}}}}vanClock+=dt;if(vanPhase===0){van.position.x=Math.min(-3.5,van.position.x+dt*2);if(van.position.x>=-3.5){vanPhase=1;vanClock=0;document.getElementById('status').textContent='🚚 GLS-vognen ankommer med pakker!'}}else if(vanPhase===1&&vanClock>9)vanPhase=2;else if(vanPhase===2){van.position.x+=dt*2;if(van.position.x>13){vanPhase=3;vanClock=0}}else if(vanPhase===3&&vanClock>14){van.position.x=-13;vanPhase=0}camera.position.x=14+Math.sin(t*.025)*.5;camera.lookAt(0,1,0);r.render(scene,camera)}requestAnimationFrame(frame);
function resize(){let a=innerWidth/innerHeight,w=12;camera.left=-w*a/2;camera.right=w*a/2;camera.top=w/2;camera.bottom=-w/2;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}resize();addEventListener('resize',resize);
</script></html>
