<style>

<div id="top"><div class="brand"><h1>🌍 Little World <small style="font-size:11px;color:#9ddcbf">0.5</small></h1><div id="sub">Din levende planet</div></div></div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const KEY='little-world-v05', R=4.8, DAY=120, STEP=.25, MAX_BUSHES=260, MAX_CREATURES=90;
const $=id=>document.getElementById(id), rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function randomUnit(){let z=rand(-1,1),a=rand(0,Math.PI*2),q=Math.sqrt(1-z*z);return [q*Math.cos(a),z,q*Math.sin(a)]}
function norm(a){let l=Math.hypot(...a)||1;return a.map(x=>x/l)}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function nearby(a,range){return norm([a[0]+rand(-range,range),a[1]+rand(-range,range),a[2]+rand(-range,range)])}
function fertilePoint(){let p=randomUnit();for(let i=0;i<30&&habitat(p)<.7;i++)p=randomUnit();return p}
function makeBush(p=fertilePoint(),age=rand(0,80)){return {p,age,health:rand(65,100),berries:0,seedClock:rand(0,150),maxBerries:Math.floor(rand(3,8))}}

function makeCreature(p=randomUnit(),generation=1,hue=rand(15,330),speed=rand(.6,1.3)){return {p,age:rand(0,25),energy:rand(65,110),health:100,attack:rand(.8,1.25),defense:rand(.8,1.2),generation,hue,speed,heading:randomUnit(),reproCooldown:rand(15,90),combatCooldown:0}}
function fresh(){return {version:5,lastSaved:Date.now(),seconds:0,births:0,deaths:0,fights:0,generation:1,bushes:Array.from({length:55},()=>makeBush()),creatures:Array.from({length:15},()=>makeCreature(fertilePoint()))}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!state||state.version!==5||!Array.isArray(state.bushes)||!Array.isArray(state.creatures))state=fresh();
const scene=new THREE.Scene();scene.background=new THREE.Color('#081321');
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);camera.position.set(0,7.2,17.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setClearColor(0x071323);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=6;controls.maxDistance=27;controls.rotateSpeed=.65;
scene.add(new THREE.HemisphereLight(0xdafaff,0x294124,2.5));
const sunlight=new THREE.DirectionalLight(0xffedc7,2.4);sunlight.position.set(7,8,6);scene.add(sunlight);
// Colorful terrain, painted directly onto a high resolution sphere.
const terrain=new THREE.SphereGeometry(R,128,96), positions=terrain.attributes.position;
const colors=[], tempColor=new THREE.Color();
const pondCenters=[norm([.6,.34,.7]),norm([-.7,-.1,.7]),norm([.2,-.55,-.6])];
const noise=p=>Math.sin(p[0]*19+p[2]*11)*Math.cos(p[1]*21-p[0]*7)*.5+Math.sin(p[2]*41+p[1]*17)*.2;
const continental=p=>Math.sin(p[0]*6+p[2]*5)*Math.cos(p[1]*7-p[2]*4);
function biome(p){
 const lat=Math.abs(p[1]),n=noise(p),dry=Math.sin(p[0]*4.2+p[2]*3.8)+continental(p)*.65;
 if(lat>.79+n*.035)return 'snow';
 if(lat>.66+n*.04)return 'tundra';
 if(pondCenters.some(q=>dot(p,q)>.978+n*.009))return 'water';
 if(dry>.75&&lat<.58)return 'desert';
 if(dry>.44&&lat<.65)return 'savanna';
 if(dry<-.15&&lat<.64)return 'forest';
 return 'meadow';
}
function elevation(p){
 const b=biome(p),hill=(Math.sin(p[0]*12+p[1]*7)*Math.cos(p[2]*11-p[1]*8)+1)*.5;
 const ridge=Math.pow(Math.abs(Math.sin(p[0]*18+p[2]*14)*Math.cos(p[1]*13)),3);
 return b==='water' ? -.06 : .035+hill*.12+ridge*(b==='snow'||b==='tundra'?.30:.22);
}
function habitat(p){const b=biome(p);return b==='forest'?1.35:b==='meadow'?1.15:b==='savanna'?.55:b==='tundra'?.30:b==='desert'?.12:.02}
const palette={water:'#399fb5',desert:'#d9b77d',savanna:'#9baf62',forest:'#377e49',meadow:'#78b764',tundra:'#8a9d88',snow:'#e2eff0'};
for(let i=0;i<positions.count;i++){
 const p=norm([positions.getX(i),positions.getY(i),positions.getZ(i)]),b=biome(p);
 const r=R+elevation(p);positions.setXYZ(i,p[0]*r,p[1]*r,p[2]*r);
 tempColor.set(palette[b]);tempColor.offsetHSL(0,0,noise(p)*.08);
 colors.push(tempColor.r,tempColor.g,tempColor.b);
}
terrain.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));positions.needsUpdate=true;terrain.computeVertexNormals();
const planet=new THREE.Mesh(terrain,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.97}));scene.add(planet);
const glow=new THREE.Mesh(new THREE.SphereGeometry(R+0.04,48,32),new THREE.MeshBasicMaterial({color:0x96e4bb,transparent:true,opacity:.035,side:THREE.BackSide}));scene.add(glow);
const world=new THREE.Group();scene.add(world);
const yaxis=new THREE.Vector3(0,1,0);
function place(obj,p,height=0){const v=new THREE.Vector3(...p).normalize();obj.position.copy(v).multiplyScalar(R+elevation(p)+height);obj.quaternion.setFromUnitVectors(yaxis,v)}
// Decor: grasses, flower fields, rocks, clusters of stylized trees, and tiny mushrooms.
const grassMats=[0x9edc73,0x4d9d50,0xb9d77c].map(color=>new THREE.MeshStandardMaterial({color,roughness:1,side:THREE.DoubleSide}));
const grassGeo=new THREE.ConeGeometry(.018,.115,3);
for(let i=0;i<2600;i++){let p=randomUnit(),b=biome(p);if(!['meadow','forest','savanna','tundra'].includes(b))continue;let m=new THREE.Mesh(grassGeo,grassMats[Math.floor(rand(0,3))]);place(m,p,.038);m.scale.setScalar(rand(.55,1.4));world.add(m)}
const rockMat=new THREE.MeshStandardMaterial({color:0xaeb8a7,roughness:1}),rockGeo=new THREE.DodecahedronGeometry(.09,0);
for(let i=0;i<95;i++){let p=randomUnit();if(biome(p)==='water')continue;let m=new THREE.Mesh(rockGeo,rockMat);place(m,p,.045);m.scale.setScalar(rand(.5,1.7));world.add(m)}
const flowerGeo=new THREE.SphereGeometry(.026,6,5),flowerMats=[0xffd96a,0xff91bd,0xf6f0db,0xc4a5fc].map(color=>new THREE.MeshStandardMaterial({color,roughness:.8}));
for(let i=0;i<650;i++){let p=randomUnit();if(!['meadow','forest','tundra'].includes(biome(p)))continue;let flower=new THREE.Mesh(flowerGeo,flowerMats[Math.floor(rand(0,flowerMats.length))]);place(flower,p,.085);flower.scale.setScalar(rand(.6,1.3));world.add(flower)}
const barkMat=new THREE.MeshStandardMaterial({color:0x816344,roughness:1}),trunkGeo=new THREE.CylinderGeometry(.042,.07,.34,6);
const crownGeo=new THREE.IcosahedronGeometry(.19,1),crownMats=[0x3b9958,0x58b36b,0x2c8050,0x83b65b,0xe3a0b9].map(color=>new THREE.MeshStandardMaterial({color,roughness:1}));
for(let i=0;i<260;i++){let p=randomUnit(),b=biome(p);if(!['forest','meadow','savanna','tundra'].includes(b)||(b!=='forest'&&Math.random()<.84))continue;
 let g=new THREE.Group(),trunk=new THREE.Mesh(trunkGeo,barkMat);trunk.position.y=.19;g.add(trunk);
 let crown=new THREE.Mesh(crownGeo,crownMats[Math.floor(rand(0,crownMats.length))]);crown.position.y=.45;crown.scale.set(rand(.8,1.25),rand(1,1.6),rand(.8,1.25));g.add(crown);
 let second=new THREE.Mesh(crownGeo,crown.material);second.position.set(.1,.52,.06);second.scale.set(.65,.75,.65);g.add(second);
 place(g,p,.015);g.scale.setScalar(rand(.7,1.35));world.add(g)
}
// Desert cacti and snowy boulders reflect the local climate.
const cactusMat=new THREE.MeshStandardMaterial({color:0x398b65,roughness:.9});
const cactusGeo=new THREE.CapsuleGeometry(.065,.25,4,7);
for(let i=0;i<130;i++){let p=randomUnit();if(biome(p)!=='desert')continue;let m=new THREE.Mesh(cactusGeo,cactusMat);place(m,p,.18);m.scale.setScalar(rand(.65,1.35));world.add(m)}
const snowMat=new THREE.MeshStandardMaterial({color:0xe9f6fa,roughness:1});
for(let i=0;i<250;i++){let p=randomUnit();if(biome(p)!=='snow')continue;let m=new THREE.Mesh(rockGeo,snowMat);place(m,p,.07);m.scale.setScalar(rand(.5,2.4));world.add(m)}
const starsGeo=new THREE.BufferGeometry(),stars=[];for(let i=0;i<950;i++){let p=randomUnit(),r=rand(25,65);stars.push(p[0]*r,p[1]*r,p[2]*r)}starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xd6e9ff,size:.085,sizeAttenuation:true})));
const leafMat=new THREE.MeshStandardMaterial({color:0x4caa61,roughness:1}),stemMat=new THREE.MeshStandardMaterial({color:0x567e3c}),berryMat=new THREE.MeshStandardMaterial({color:0xd64d7c,roughness:.7});
const bushGeo=new THREE.IcosahedronGeometry(.115,1),stemGeo=new THREE.CylinderGeometry(.026,.04,.17,5),berryGeo=new THREE.SphereGeometry(.025,6,5);
const bodyGeo=new THREE.SphereGeometry(.115,10,8),eyeGeo=new THREE.SphereGeometry(.017,6,5),eyeMat=new THREE.MeshStandardMaterial({color:0x12272c});
let bushMeshes=[],creatureMeshes=[];
function buildBush(){let g=new THREE.Group(),stem=new THREE.Mesh(stemGeo,stemMat),leaf=new THREE.Mesh(bushGeo,leafMat);stem.position.y=.08;leaf.position.y=.18;g.add(stem,leaf);for(let i=0;i<7;i++){let a=i*2.39996,b=new THREE.Mesh(berryGeo,berryMat);b.position.set(Math.cos(a)*.075,.21+(i%3)*.028,Math.sin(a)*.075);g.add(b)}world.add(g);return g}
function buildCreature(){
 let g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.75}),body=new THREE.Mesh(bodyGeo,mat);
 body.position.y=.16;body.scale.set(1.1,.95,1.1);g.add(body);
 // Ears, snout, eyes, and tail make the creature readable even when zoomed out.
 let earGeo=new THREE.CapsuleGeometry(.027,.10,3,6);
 for(let side of [-1,1]){
  let ear=new THREE.Mesh(earGeo,mat);ear.position.set(side*.065,.31,-.025);ear.rotation.z=side*-.22;g.add(ear);
  let eye=new THREE.Mesh(eyeGeo,eyeMat);eye.position.set(side*.057,.20,.098);eye.scale.setScalar(1.1);g.add(eye);
  let foot=new THREE.Mesh(new THREE.SphereGeometry(.034,6,5),mat);foot.position.set(side*.075,.06,.055);g.add(foot)
 }
 let snout=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),new THREE.MeshStandardMaterial({color:0xf4c4b9}));snout.position.set(0,.13,.117);g.add(snout);
 let tail=new THREE.Mesh(new THREE.SphereGeometry(.048,10,8),mat);tail.position.set(0,.15,-.12);g.add(tail);
let back=new THREE.Mesh(new THREE.SphereGeometry(.075,12,8),mat);back.position.set(0,.19,-.07);back.scale.set(1,.8,1.4);g.add(back);
let hornGeo=new THREE.ConeGeometry(.027,.105,8);
for(let side of [-1,1]){let horn=new THREE.Mesh(hornGeo,new THREE.MeshStandardMaterial({color:0xf6e2b7,roughness:.65}));horn.position.set(side*.05,.32,.035);horn.rotation.z=side*.25;g.add(horn)}
let armor=new THREE.Mesh(new THREE.SphereGeometry(.07,12,8),new THREE.MeshStandardMaterial({color:0x445c54,roughness:.85}));armor.position.set(0,.22,-.035);armor.scale.set(1.3,.4,1.25);g.add(armor);
 world.add(g);return g
}
function syncMeshes(){
while(bushMeshes.length<state.bushes.length)bushMeshes.push(buildBush());
while(bushMeshes.length>state.bushes.length){let m=bushMeshes.pop();world.remove(m)}
state.bushes.forEach((b,i)=>{let m=bushMeshes[i],growth=clamp(b.age/90,.12,1);place(m,b.p,.015);m.scale.setScalar(growth);for(let j=0;j<7;j++)m.children[j+2].visible=j<Math.floor(b.berries);m.children[1].material=leafMat});
while(creatureMeshes.length<state.creatures.length)creatureMeshes.push(buildCreature());
while(creatureMeshes.length>state.creatures.length){let m=creatureMeshes.pop();world.remove(m);m.children[0].material.dispose()}
state.creatures.forEach((c,i)=>{let m=creatureMeshes[i];place(m,c.p,.02);m.scale.setScalar(clamp(.7+c.age/100,.65,1.2));m.children[0].material.color.setHSL(c.hue/360,.7,.66);m.children[1].material.color.setHSL(c.hue/360,.7,.66)});
}
function simulate(dt){
state.seconds+=dt;
for(const b of state.bushes){
 b.age+=dt;b.seedClock+=dt;const fertility=habitat(b.p);b.health+=dt*(fertility-.55)*.035;
 const mature=clamp((b.age-35)/85,0,1);
 if(mature>0&&b.health>20)b.berries=clamp(b.berries+dt*.025*mature*(b.health/100)*fertility,0,b.maxBerries);
 if(b.age>800)b.health-=dt*.16;if(fertility<.2)b.health-=dt*.08;b.health=clamp(b.health,0,100);
 if(b.seedClock>125&&mature>.8&&b.berries>1&&state.bushes.length<MAX_BUSHES){b.seedClock=0;b.berries=Math.max(0,b.berries-1);state.bushes.push(makeBush(nearby(b.p,.20),0))}
}
state.bushes=state.bushes.filter(b=>b.health>0);
for(const c of state.creatures){
 c.age+=dt;c.reproCooldown-=dt;c.combatCooldown=Math.max(0,(c.combatCooldown||0)-dt);
 c.energy-=dt*(.16+.085*c.speed)*(biome(c.p)==='snow'?1.5:biome(c.p)==='desert'?1.3:1);
 let target=null,best=-1;
 for(const b of state.bushes){if(b.berries<.95||b.age<40)continue;let d=dot(c.p,b.p);if(d>best){best=d;target=b}}
 if(target&&best>.65){
   const toward=[target.p[0]-c.p[0]*best,target.p[1]-c.p[1]*best,target.p[2]-c.p[2]*best];
   c.p=norm([c.p[0]+toward[0]*dt*.06*c.speed,c.p[1]+toward[1]*dt*.06*c.speed,c.p[2]+toward[2]*dt*.06*c.speed]);
   if(dot(c.p,target.p)>.9995&&target.berries>=1){target.berries-=1;c.energy=clamp(c.energy+29,0,160);target.health=clamp(target.health+.12,0,100)}
 }else{c.heading=nearby(c.heading,.5);c.p=norm([c.p[0]+c.heading[0]*dt*.025*c.speed,c.p[1]+c.heading[1]*dt*.025*c.speed,c.p[2]+c.heading[2]*dt*.025*c.speed])}
 if(c.energy>112&&c.age>55&&c.reproCooldown<=0&&state.creatures.length<MAX_CREATURES){
  c.energy-=53;c.reproCooldown=rand(85,150);let child=makeCreature(nearby(c.p,.06),c.generation+1,c.hue,clamp(c.speed+rand(-.12,.12),.4,1.65));child.attack=clamp(c.attack+rand(-.08,.08),.6,1.6);child.defense=clamp(c.defense+rand(-.08,.08),.6,1.6);child.energy=54;child.age=0;state.creatures.push(child);state.births++;state.generation=Math.max(state.generation,child.generation);
 }
}
// Rival clans clash when they meet. Each fight costs energy and can cause death.
const living=state.creatures;
for(let i=0;i<living.length;i++){
 const a=living[i];if(a.combatCooldown>0||a.energy<12||a.health<=0)continue;
 for(let j=i+1;j<living.length;j++){
  const b=living[j];if(b.combatCooldown>0||b.health<=0)continue;
  if(dot(a.p,b.p)<.9992)continue;if(a.energy>95&&b.energy>95)continue;
  const damageA=rand(5,13)*b.attack/a.defense,damageB=rand(5,13)*a.attack/b.defense;
  a.health-=damageA;b.health-=damageB;a.energy-=rand(1,4);b.energy-=rand(1,4);
  a.combatCooldown=rand(8,16);b.combatCooldown=rand(8,16);state.fights++;
  if(Math.random()<.55){a.heading=norm([a.p[0]-b.p[0]+rand(-.3,.3),a.p[1]-b.p[1]+rand(-.3,.3),a.p[2]-b.p[2]+rand(-.3,.3)]);b.heading=norm([b.p[0]-a.p[0]+rand(-.3,.3),b.p[1]-a.p[1]+rand(-.3,.3),b.p[2]-a.p[2]+rand(-.3,.3)])}
  break;
 }
}
const before=state.creatures.length;state.creatures=state.creatures.filter(c=>c.energy>0&&c.health>0&&c.age<750);state.deaths+=before-state.creatures.length;
if(state.creatures.length===0&&state.seconds>20){state.creatures.push(makeCreature(fertilePoint()));state.creatures.push(makeCreature(fertilePoint()));$('notice').textContent='🌱 Naturen har skabt nyt liv efter en uddøen.'}
if(state.bushes.length<8)for(let i=0;i<6;i++)state.bushes.push(makeBush(fertilePoint(),rand(0,50)));
}
function save(){state.lastSaved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('notice').textContent='Kunne ikke gemme lokalt. Kontrollér browserens lagerplads.'}}
let away=Math.max(0,Date.now()-(state.lastSaved||Date.now()))/1000;
let catchup=Math.min(away,3600); // max 1 hour of accelerated offline evolution
for(let t=0;t<catchup;t+=2)simulate(Math.min(2,catchup-t));
if(away>3)$('notice').textContent=`🌍 Planeten udviklede sig i ${Math.round(catchup)} sekunder, mens du var væk${away>3600?' (maks. 1 time simuleret)':''}.`;
syncMeshes();save();
let paused=false,speed=1,previous=performance.now(),acc=0,lastHud=0;
function hud(){let bs=state.bushes,cs=state.creatures;$('creatures').textContent=cs.length;$('bushes').textContent=bs.length;$('births').textContent=state.births;$('deaths').textContent=state.deaths;$('days').textContent=(1+Math.floor(state.seconds/DAY));$('berries').textContent=Math.floor(bs.reduce((a,b)=>a+b.berries,0));$('fights').textContent=state.fights||0;$('clans').textContent=Math.round(100*bs.filter(b=>b.health>50).length/Math.max(1,bs.length))+'%';$('sub').textContent=`Generation ${state.generation} · ${paused?'Sat på pause':'Økosystemet lever'}`}
function frame(t){requestAnimationFrame(frame);let delta=Math.min(.15,(t-previous)/1000);previous=t;if(!paused){acc+=delta*speed;let loops=0;while(acc>=STEP&&loops++<20){simulate(STEP);acc-=STEP}syncMeshes()}const tick=t*.005;for(let i=0;i<creatureMeshes.length;i++){let m=creatureMeshes[i],c=state.creatures[i];if(!c)continue;
const hop=Math.sin(tick*c.speed+i*2.1);m.children[0].position.y=.16+Math.max(0,hop)*.024;
m.children[3].position.y=.06+Math.max(0,hop)*.04;
m.children[6].position.y=.06+Math.max(0,-hop)*.04;
m.children[8].position.x=Math.sin(tick*.8+i)*.045;
m.children[0].scale.y=.95+Math.sin(tick*c.speed+i)*.045;
}
if(t-lastHud>300){hud();lastHud=t}controls.update();renderer.render(scene,camera)}
requestAnimationFrame(frame);
$('plant').onclick=()=>{for(let i=0;i<10&&state.bushes.length<MAX_BUSHES;i++)state.bushes.push(makeBush(fertilePoint(),0));syncMeshes();save();$('notice').textContent='🌱 10 nye buske er plantet. De skal vokse, før de giver bær.'};
$('speed').onclick=()=>{speed=speed===1?4:speed===4?12:1;$('speed').textContent=`⏩ ${speed}× tid`};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Fortsæt':'⏸ Pause';save()};
$('reset').onclick=()=>{if(confirm('Vil du starte en helt ny planet? Den nuværende udvikling slettes.')){state=fresh();syncMeshes();save();$('notice').textContent='🌎 En ny planet er født.'}};
setInterval(save,5000);addEventListener('pagehide',save);addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
