<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little World – Prototype</title><style>body{margin:0;background:#080f23;color:#f1f6ff;font-family:system-ui,sans-serif}header{position:absolute;top:18px;left:20px;z-index:2}h1{margin:0;font-size:24px}p{opacity:.75}#hud{position:absolute;bottom:18px;left:18px;background:#101b35dd;padding:14px;border-radius:14px;max-width:290px}button{background:#275b6b;border:0;border-radius:8px;padding:9px 12px;color:white;cursor:pointer}#status{font-size:13px;line-height:1.6}canvas{display:block}small{opacity:.7}</style></head><body><header><h1>🌱 Little World</h1><p>En levende lille planet</p></header><div id="hud"><div id="status"></div><p><button id="feed">Plant 20 frø</button> <button id="pause">Pause</button></p><small>Træk for at dreje · Scroll for at zoome · Verden gemmes lokalt</small></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080f23);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,5,11);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=19;controls.enablePan=false;scene.add(new THREE.HemisphereLight(0xd5f4ff,0x2d4828,2));const sun=new THREE.DirectionalLight(0xffe5ac,2.2);sun.position.set(6,8,5);scene.add(sun);
const R=3,planet=new THREE.Mesh(new THREE.SphereGeometry(R,64,48),new THREE.MeshStandardMaterial({color:0x5caa54,roughness:1}));scene.add(planet);const world=new THREE.Group();scene.add(world);const unit=()=>{let z=Math.random()*2-1,a=Math.random()*Math.PI*2,r=Math.sqrt(1-z*z);return new THREE.Vector3(r*Math.cos(a),z,r*Math.sin(a))};const put=(mesh,v,height=0)=>{mesh.position.copy(v).multiplyScalar(R+height);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v);world.add(mesh)};
const treeMat=new THREE.MeshStandardMaterial({color:0x278f54}),trunkMat=new THREE.MeshStandardMaterial({color:0x8d6241});for(let i=0;i<90;i++){const v=unit(),g=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.045,.075,.27,6),trunkMat),crown=new THREE.Mesh(new THREE.ConeGeometry(.18+Math.random()*.12,.42+Math.random()*.25,7),treeMat);trunk.position.y=.13;crown.position.y=.42;g.add(trunk,crown);put(g,v,.01)}
const grassMat=new THREE.MeshStandardMaterial({color:0x94cb6a});for(let i=0;i<420;i++){let v=unit(),mesh=new THREE.Mesh(new THREE.ConeGeometry(.022,.11,3),grassMat);put(mesh,v,.02)}
let state;try{state=JSON.parse(localStorage.getItem('little-world-save'))}catch{}if(!state||!Array.isArray(state.creatures))state={time:Date.now(),generation:1,creatures:Array.from({length:14},()=>({p:unit().toArray(),h:Math.random()*360,s:.5+Math.random()*.8,e:70+Math.random()*40,age:0,g:1})),food:40};let paused=false;const creatures=[];function sync(){while(creatures.length>state.creatures.length){world.remove(creatures.pop())}while(creatures.length<state.creatures.length){let mesh=new THREE.Group(),body=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),new THREE.MeshStandardMaterial({color:0xffffff})),eye=new THREE.Mesh(new THREE.SphereGeometry(.018,6,6),new THREE.MeshStandardMaterial({color:0x13202a}));eye.position.set(.05,.065,.10);mesh.add(body,eye);world.add(mesh);creatures.push(mesh)}state.creatures.forEach((c,i)=>{const v=new THREE.Vector3(...c.p).normalize(),mesh=creatures[i];mesh.position.copy(v).multiplyScalar(R+.13);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v);mesh.children[0].material.color.setHSL(c.h/360,.72,.65);mesh.scale.setScalar(c.s)})}
function tick(){state.food=Math.min(180,state.food+.045);for(const c of state.creatures){let v=new THREE.Vector3(...c.p),t=unit().multiplyScalar(.018*c.s);v.add(t).normalize();c.p=v.toArray();c.age++;c.e-=.065*c.s;if(state.food>1&&Math.random()<.025){state.food--;c.e+=16}if(c.e>145&&state.creatures.length<80){c.e*=.52;const child={...c,p:[...c.p],h:(c.h+(Math.random()-.5)*25+360)%360,s:Math.max(.35,Math.min(1.5,c.s+(Math.random()-.5)*.12)),e:65,age:0,g:c.g+1};state.creatures.push(child);state.generation=Math.max(state.generation,child.g)}}state.creatures=state.creatures.filter(c=>c.e>0&&c.age<3500);if(!state.creatures.length)state.creatures.push({p:unit().toArray(),h:120,s:.8,e:90,age:0,g:state.generation});}
const elapsed=Math.min(20000,Math.floor(Math.max(0,Date.now()-state.time)/1000));for(let i=0;i<elapsed;i++)tick();state.time=Date.now();sync();let prev=performance.now(),acc=0;function animate(t){requestAnimationFrame(animate);if(!paused){acc+=Math.min(.1,(t-prev)/1000);while(acc>.13){tick();acc-=.13}sync()}prev=t;controls.update();renderer.render(scene,camera);document.getElementById('status').textContent=`Væsner: ${state.creatures.length} · Generation: ${state.generation} · Føde: ${Math.floor(state.food)}`;}animate(prev);setInterval(()=>{state.time=Date.now();localStorage.setItem('little-world-save',JSON.stringify(state))},5000);document.getElementById('feed').onclick=()=>state.food+=20;document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Fortsæt':'Pause'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
